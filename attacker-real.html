<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실제 앱 iframe 테스트</title>
<style>
  html, body { margin: 0; padding: 0; font-family: sans-serif; background: #fff; }
  .bar { background: #263238; color: #fff; padding: 10px 12px; font-size: 14px; line-height: 1.6; }
  .bar b { color: #ffcc80; }
  iframe { width: 100%; height: 900px; border: 3px solid #c62828; display: block; }
</style>
</head>
<body>
<div class="bar">
  실제 모두싸인 앱 iframe 테스트 페이지입니다.<br>
  아래 <b>빨간 테두리 안</b>이 다른 사이트 페이지 안에 iframe으로 불러온 <b>app.modusign.co.kr</b> 입니다.<br>
  로그인 화면이 뜨면 세션 유지 실패, 로그인된 홈/문서 화면이 뜨면 세션 유지 성공입니다.
</div>
<iframe src="https://app.modusign.co.kr/" title="modusign-real" scrolling="yes"></iframe>
</body>
</html>
